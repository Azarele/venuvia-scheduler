<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio Nova · Scheduling Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">V</span>
      <div>
        <div class="brand-title">Studio Nova</div>
        <div class="brand-sub">Venuvia scheduling assistant</div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="mode" class="badge">…</span>
      <button id="reset" class="ghost" title="Restore the original demo data">Reset demo data</button>
    </div>
  </header>

  <main class="layout">
    <section class="chat panel" aria-label="Assistant chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="suggestions" id="suggestions">
        <button>Show me my appointments for tomorrow</button>
        <button>Block tomorrow from 2 PM to 4 PM so nobody can book</button>
        <button>Reschedule my 3 PM appointment to 4 PM</button>
        <button>Block tomorrow from 5 PM to 6 PM</button>
      </div>
      <form id="composer" class="composer">
        <input id="input" type="text" autocomplete="off" placeholder="Tell the assistant what to do…" aria-label="Message" />
        <button type="submit" id="send">Send</button>
      </form>
    </section>

    <section class="schedule panel" aria-label="Schedule">
      <div class="schedule-head">
        <button id="prev" class="ghost icon" aria-label="Previous day">‹</button>
        <div class="schedule-title">
          <div id="date-label" class="date-label"></div>
          <div id="date-sub" class="date-sub"></div>
        </div>
        <button id="next" class="ghost icon" aria-label="Next day">›</button>
        <button id="today" class="ghost">Today</button>
      </div>
      <div class="legend">
        <span><i class="swatch appt"></i>Appointment</span>
        <span><i class="swatch block"></i>Blocked</span>
        <span><i class="swatch preview"></i>Pending change</span>
      </div>
      <div class="timeline-wrap">
        <div id="timeline" class="timeline"></div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
